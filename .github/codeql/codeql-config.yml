name: "CodeQL config"

# Alert filtering. Test code is not shipped and web-app security queries misfire
# on it — e.g. cs/web/missing-function-level-access-control treats public
# "Delete*" methods of Test*Controller xUnit classes as unauthenticated MVC
# actions. GitHub's default setup excludes test code automatically; this
# advanced setup must do it explicitly. (For compiled languages the CodeQL
# action applies these filters to the results, not to extraction.)
paths-ignore:
  - IntroSkipper.Tests
