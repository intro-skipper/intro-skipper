version: 2
updates:
  # Fetch and update latest `nuget` pkgs
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - chore
      - dependency
      - nuget
    commit-message:
      prefix: chore
      include: scope

  # Fetch and update latest `github-actions` pkgs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The codeql-action sub-actions (init, autobuild, analyze) must run at the
      # same version within a workflow; separate bump PRs leave the intermediate
      # merges with mismatched versions, which fails the CodeQL run outright.
      codeql-action:
        patterns:
          - github/codeql-action*
    labels:
      - dependency
      - github_actions
    commit-message:
      prefix: ci
      include: scope
