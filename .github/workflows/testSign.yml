name: "Test SignPath Signing"

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read version from VERSION.txt
        id: read-version
        run: |
          MAIN_VERSION=$(cat VERSION.txt)
          echo "MAIN_VERSION=${MAIN_VERSION}"
          echo "MAIN_VERSION=$MAIN_VERSION" >> $GITHUB_ENV

      - name: Check for BETA file
        id: check-beta
        run: |
          if [ -f "BETA" ]; then
            echo "IS_BETA=true" >> $GITHUB_ENV
          else
            echo "IS_BETA=false" >> $GITHUB_ENV
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Minify HTML
        run: |
          npx html-minifier-terser --collapse-boolean-attributes --collapse-whitespace --remove-comments --remove-optional-tags --remove-redundant-attributes --remove-script-type-attributes --remove-tag-whitespace --use-short-doctype --minify-css true --minify-js true -o IntroSkipper/Configuration/configPage.html IntroSkipper/Configuration/configPage.html

      - name: Restore Beta dependencies
        if: ${{env.IS_BETA == 'true' }}
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name jellyfin-pre "https://nuget.pkg.github.com/jellyfin/index.json"
          dotnet tool install --global dotnet-outdated-tool
          dotnet outdated -pre Always -u -inc Jellyfin

      - name: Restore dependencies
        if: ${{env.IS_BETA == 'false' }}
        run: dotnet restore

      - name: Run update version
        uses: intro-skipper/intro-skipper-action-ts@main
        with:
          task-type: "updateVersion"

      - name: Embed version info
        run: |
          GITHUB_SHA=${{ github.sha }}
          sed -i "s/string\.Empty/\"$GITHUB_SHA\"/g" IntroSkipper/Helper/Commit.cs

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Upload unsigned package artifacts
        if: ${{ github.repository == 'intro-skipper/intro-skipper' }}
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v6
        with:
          name: IntroSkipper-${{ env.NEW_FILE_VERSION }}-unsigned
          path: IntroSkipper/bin/Release/net9.0/IntroSkipper.dll
          if-no-files-found: error
          retention-days: 1

      - name: Sign package artifacts
        if: ${{ github.repository == 'intro-skipper/intro-skipper' }}
        uses: signpath/github-action-submit-signing-request@v2.0
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '2533cbeb-14b8-4d23-905e-37196de94787'
          project-slug: 'intro-skipper'
          signing-policy-slug: 'test-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          # overwrite the unsigned files
          output-artifact-directory: 'IntroSkipper/bin/Release/net9.0/'

      - name: Upload signed package artifacts (overwrite unsigned)
        if: ${{ github.repository == 'intro-skipper/intro-skipper' }}
        uses: actions/upload-artifact@v6
        with:
          name: IntroSkipper-${{ env.NEW_FILE_VERSION }}-signed
          path: IntroSkipper/bin/Release/net9.0/IntroSkipper.dll
          if-no-files-found: error
          retention-days: 1
