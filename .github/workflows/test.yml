name: "Run Tests"

on:
  push:
    # Pushes run only on release branches like 12.0. Pull requests run from pull_request.
    branches:
      - '[0-9]+.[0-9]+'
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "images/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep in step with FfmpegZipUrl in IntroSkipper.Tests/WindowsFfmpegTestBootstrap.cs.
      JELLYFIN_FFMPEG_VERSION: 8.1.3-1

    steps:
      - uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Resolve jellyfin-ffmpeg package
        id: ffmpeg
        run: |
          . /etc/os-release
          echo "deb=jellyfin-ffmpeg8_${JELLYFIN_FFMPEG_VERSION}-${VERSION_CODENAME}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Restore jellyfin-ffmpeg package
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/jellyfin-ffmpeg
          key: ${{ steps.ffmpeg.outputs.deb }}

      - name: Download jellyfin-ffmpeg package
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          DEB: ${{ steps.ffmpeg.outputs.deb }}
        run: |
          mkdir -p ~/jellyfin-ffmpeg
          curl -fsSL -o ~/jellyfin-ffmpeg/"$DEB" "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${JELLYFIN_FFMPEG_VERSION}/${DEB}"

      # Saved right after the download so a failing test run still fills the cache.
      - name: Save jellyfin-ffmpeg package
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/jellyfin-ffmpeg
          key: ${{ steps.ffmpeg.outputs.deb }}

      - name: Install jellyfin-ffmpeg
        env:
          DEB: ${{ steps.ffmpeg.outputs.deb }}
        run: |
          sudo apt update
          sudo apt install -y ~/jellyfin-ffmpeg/"$DEB"
          sudo ln -s /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -s /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
