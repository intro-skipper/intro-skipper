name: "Run Tests"

on:
  push:
    # Pushes run only on release branches like 12.0. Pull requests run from pull_request.
    branches:
      - '[0-9]+.[0-9]+'
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "images/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Resolve jellyfin-ffmpeg package
        id: ffmpeg
        run: |
          . /etc/os-release
          echo "deb=jellyfin-ffmpeg8_8.1.3-1-${VERSION_CODENAME}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: Cache jellyfin-ffmpeg package
        uses: actions/cache@v6
        with:
          path: ~/jellyfin-ffmpeg
          key: ${{ steps.ffmpeg.outputs.deb }}

      - name: Install jellyfin-ffmpeg
        env:
          DEB: ${{ steps.ffmpeg.outputs.deb }}
        run: |
          mkdir -p ~/jellyfin-ffmpeg
          cd ~/jellyfin-ffmpeg
          [ -f "$DEB" ] || curl -fsSLO "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-1/${DEB}"
          # The runner image usually has every dependency, so refresh the package index only when it does not.
          sudo apt install -y "./${DEB}" || { sudo apt update && sudo apt install -y "./${DEB}"; }
          sudo ln -s /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -s /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
