name: "CodeQL"

on:
  push:
    branches:
      - '*'  # Triggers on any branch push
    paths-ignore:
      - "**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "images/**"
  pull_request:
    types:
      - ready_for_review

permissions: write-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # This job will only run if the repository is public
    if: ${{ github.event.repository.private == false }}

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          output: sarif-results
          upload: failure-only

      # Test code is not shipped, and web-app security queries misfire on it —
      # e.g. cs/web/missing-function-level-access-control treats public Delete*
      # methods of Test*Controller xUnit classes as unauthenticated MVC actions.
      # For compiled languages config paths-ignore does not filter results, so
      # drop test-project alerts from the SARIF before uploading (the pattern
      # GitHub documents for excluding generated/test code).
      - name: Filter out test-project alerts
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -IntroSkipper.Tests/**
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - name: Upload filtered CodeQL results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: sarif-results/csharp.sarif
