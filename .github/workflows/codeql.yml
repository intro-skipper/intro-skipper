name: "CodeQL"

on:
  push:
    branches:
      - '*'  # Triggers on any branch push
    paths-ignore:
      - "**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "images/**"
  pull_request:
    types:
      - ready_for_review

permissions: write-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # This job will only run if the repository is public
    if: ${{ github.event.repository.private == false }}

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: sarif-results
          upload: failure-only

      # Test code is not shipped, and web-app security queries misfire on it —
      # e.g. cs/web/missing-function-level-access-control treats public Delete*
      # methods of Test*Controller xUnit classes as unauthenticated MVC actions.
      # For compiled languages config paths-ignore does not filter results, so
      # drop test-project alerts from the SARIF before uploading (the pattern
      # GitHub documents for excluding generated/test code).
      - name: Filter out test-project alerts
        uses: advanced-security/filter-sarif@f3b8118a9349d88f7b1c0c488476411145b6270d # v1
        with:
          patterns: |
            -IntroSkipper.Tests/**
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - name: Upload filtered CodeQL results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results/csharp.sarif
