name: "Setup build environment"
description: "Reads build.json, installs .NET/Node/pnpm, configures beta NuGet, and restores dependencies."
inputs:
  github-token:
    description: "GitHub token used for beta Jellyfin package feed access."
    required: true
runs:
  using: "composite"
  steps:
    - name: Read build configuration
      id: build-config
      shell: bash
      run: |
        CONFIG=$(cat build.json)
        MAIN_VERSION=$(echo "$CONFIG" | jq -r '.version')
        IS_BETA=$(echo "$CONFIG" | jq -r '.beta')
        DOTNET_VERSION=$(echo "$CONFIG" | jq -r '."dotnet-version"')
        DOTNET_MAJOR=$(echo "$DOTNET_VERSION" | cut -d'.' -f1)

        echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
        echo "IS_BETA=$IS_BETA" >> "$GITHUB_ENV"
        echo "DOTNET_VERSION=$DOTNET_VERSION" >> "$GITHUB_ENV"
        echo "DOTNET_TFM=net${DOTNET_MAJOR}.0" >> "$GITHUB_ENV"
        echo "dotnet-version=$DOTNET_VERSION" >> "$GITHUB_OUTPUT"
        echo "is-beta=$IS_BETA" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ steps.build-config.outputs.dotnet-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "lts/*"
        cache: "pnpm"
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Configure NuGet for beta
      if: ${{ steps.build-config.outputs.is-beta == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cp nuget/NuGet.Beta.Config IntroSkipper/NuGet.Config
        dotnet nuget add source --username ${{ github.repository_owner }} --password "$GH_TOKEN" --store-password-in-clear-text --name github-jellyfin "https://nuget.pkg.github.com/jellyfin/index.json"
        dotnet tool install --global dotnet-outdated-tool
        dotnet outdated -pre Always -u -inc Jellyfin

    - name: Restore dependencies
      shell: bash
      run: dotnet restore
